name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: radar/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Type-check + build
        run: npm run build

  pr-size:
    name: Tamanho do PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar linhas alteradas (aviso acima de 400)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          LINES=$(git diff --numstat "$BASE" "$HEAD" -- . ':(exclude)radar/package-lock.json' | awk '{ s += $1 + $2 } END { print s + 0 }')
          echo "Linhas alteradas: $LINES"
          if [ "$LINES" -gt 400 ]; then
            echo "::warning title=PR grande::Este PR altera $LINES linhas (recomendado ≤ 400). Considere dividir em PRs menores."
          fi
